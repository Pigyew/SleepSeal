<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font-family:-apple-system,sans-serif;font-size:14px;line-height:1.5}</style><h1>打开 SleepSeal</h1><p>如果设置窗口没有出现，请从“应用程序”打开 SleepSeal。首次向导会请你确认启用保护并授予蓝牙权限。现有用户会在安全迁移后保留原有保护行为。</p><p>如果 macOS 阻止此尚未公证的 Beta，请先核对公开的校验值和源码，再到“系统设置 → 隐私与安全性”批准 SleepSeal。无需关闭系统安全功能。</p><p>在 SleepSeal 中应用的电源时间设置会直接保存在 macOS 中，退出应用后仍有效。Apple 芯片的深度睡眠继续由 macOS 管理。</p></html>
