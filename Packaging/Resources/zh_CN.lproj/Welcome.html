<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>body{font-family:-apple-system,sans-serif;font-size:14px;line-height:1.5;color:#243139}h1{font-size:22px}</style><h1>SleepSeal 0.2.1 Beta</h1><p>SleepSeal 旨在减少 MacBook 睡眠期间不必要的无线及电源活动。你可以在原生面板中选择需要保护的睡眠方式。</p><p>安装器会将 SleepSeal 放入“应用程序”，并安装权限受限、由 root 拥有的电源设置工具。管理员授权通过 macOS 的正常安装窗口完成。</p><p>此 Beta 使用临时签名，尚未公证。安装完成后，请打开 SleepSeal，按照 macOS 提示批准应用并授权蓝牙。支持 Apple 芯片与 macOS 13 或更新版本；实际睡眠行为和节电效果因设备与软件而异。</p></html>
